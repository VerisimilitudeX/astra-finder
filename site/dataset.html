<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data file — ASTRA Discoverability</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="header-mark" href="./" aria-label="ASTRA Discoverability home">✴</a>
      <nav class="header-nav">
        <a href="https://github.com/VerisimilitudeX/astra-finder" target="_blank" rel="noopener" aria-label="GitHub repository">
          <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <main class="page">
    <p class="crumb"><a href="./">← Back to the index</a></p>
    <div id="dataset-root">
      <p class="empty">Loading…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>Content-addressed by git blob hash — identical bytes share one page.</span>
      <a href="https://github.com/VerisimilitudeX/astra-finder" target="_blank" rel="noopener">Source</a>
    </div>
  </footer>

  <script>
  (function () {
    "use strict";
    var root = document.getElementById("dataset-root");
    var hash = new URLSearchParams(location.search).get("h") || "";

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function formatSize(n) {
      if (!n) return "";
      if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
      if (n >= 1024) return (n / 1024).toFixed(1) + " kB";
      return n + " B";
    }

    fetch("datasets.json", { cache: "no-cache" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var d = (data.datasets || []).find(function (x) { return x.hash === hash; });
        if (!d) {
          root.innerHTML = '<p class="empty">No data file with that hash is in the index.</p>';
          document.title = "Unknown data file — ASTRA Discoverability";
          return;
        }
        document.title = d.names[0] + " — ASTRA Discoverability";
        var occ = d.occurrences || [];
        var size = occ.length ? occ[0].size : 0;
        var rows = occ
          .map(function (o) {
            var raw = "https://raw.githubusercontent.com/" + o.repo + "/" + o.branch + "/" + o.path;
            var repoPage = "repo.html?r=" + encodeURIComponent(o.repo);
            return (
              "<tr>" +
              '<td><a class="link-btn" href="' + escapeHtml(repoPage) + '">' + escapeHtml(o.analysis) + "</a>" +
              '<a class="occ-repo" href="' + escapeHtml(repoPage) + '">' + escapeHtml(o.repo) + "</a></td>" +
              '<td><span class="role role-' + escapeHtml(o.role) + '">' + escapeHtml(o.role) + "</span></td>" +
              '<td class="occ-path">' + escapeHtml(o.path) + "</td>" +
              '<td><a class="raw-link" href="' + escapeHtml(raw) + '" target="_blank" rel="noopener">Open raw file ↗</a></td>' +
              "</tr>"
            );
          })
          .join("");
        root.innerHTML =
          '<section class="intro"><h1 class="dataset-title">' + escapeHtml(d.names[0]) + "</h1>" +
          (d.names.length > 1
            ? '<p class="intro-sub">Also carried as: ' + d.names.slice(1).map(escapeHtml).join(", ") + "</p>"
            : "") +
          '<p class="hash-line"><span class="detail-label">Content hash</span><code class="hash">' + escapeHtml(d.hash) + "</code>" +
          (size ? '<span class="dataset-count">' + formatSize(size) + "</span>" : "") +
          "</p></section>" +
          '<table class="occ-table"><thead><tr><th>Analysis</th><th>Role</th><th>Path in repository</th><th></th></tr></thead>' +
          "<tbody>" + rows + "</tbody></table>";
      })
      .catch(function () {
        root.innerHTML = '<p class="empty">Could not load the data index.</p>';
      });
  })();
  </script>
</body>
</html>

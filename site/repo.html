<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analysis — ASTRA Discoverability</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="header-mark" href="./" aria-label="ASTRA Discoverability home">✴</a>
      <nav class="header-nav">
        <a href="https://github.com/VerisimilitudeX/astra-finder" target="_blank" rel="noopener" aria-label="GitHub repository">
          <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <main class="page">
    <p class="crumb"><a href="./">← Back to the index</a></p>
    <div id="repo-root">
      <p class="empty">Loading…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>Index refreshed <span id="refreshed">—</span>. Rebuilt every six hours from the GitHub API.</span>
      <a href="https://github.com/VerisimilitudeX/astra-finder" target="_blank" rel="noopener">Source</a>
    </div>
  </footer>

  <script>
  (function () {
    "use strict";
    var root = document.getElementById("repo-root");
    var refreshedEl = document.getElementById("refreshed");
    var fullName = new URLSearchParams(location.search).get("r") || "";

    var CANONICAL_BASE = "https://verisimilitudex.github.io/astra-finder/";

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function formatStars(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k";
      return String(n);
    }

    function timeAgo(iso) {
      if (!iso) return "";
      var days = Math.floor((Date.now() - new Date(iso).getTime()) / 864e5);
      if (days < 1) return "today";
      if (days < 30) return days + " days ago";
      if (days < 365) return Math.floor(days / 30) + " months ago";
      return Math.floor(days / 365) + " years ago";
    }

    function displayName(p) {
      return p.astra_name || (p.full_name || "").split("/")[1] || p.full_name;
    }

    function repoUrl(name) {
      return "repo.html?r=" + encodeURIComponent(name);
    }

    function allTags(p) {
      var seen = {};
      return (p.topics || []).concat(p.astra_tags || []).filter(function (t) {
        t = String(t);
        if (seen[t.toLowerCase()]) return false;
        seen[t.toLowerCase()] = true;
        return true;
      });
    }

    function badgeMarkdown(p) {
      var img = CANONICAL_BASE + "badges/" + p.full_name.replace("/", "--") + ".svg";
      return "[![ASTRA verified](" + img + ")](" + CANONICAL_BASE + ")";
    }

    // hashes/files for one repo out of the content-addressed dataset index
    function filesFor(datasets, repo) {
      var hashes = {};
      var files = [];
      datasets.forEach(function (d) {
        (d.occurrences || []).forEach(function (o) {
          if (o.repo !== repo || hashes[d.hash]) return;
          hashes[d.hash] = true;
          files.push({ hash: d.hash, name: o.name, role: o.role, path: o.path, branch: o.branch });
        });
      });
      files.sort(function (a, b) {
        return a.role === b.role ? a.name.localeCompare(b.name) : a.role === "input" ? -1 : 1;
      });
      return { hashes: hashes, files: files };
    }

    function render(projects, datasets) {
      var p = projects.find(function (x) { return x.full_name === fullName; });
      if (!p) {
        root.innerHTML = '<p class="empty">No analysis with that repository name is in the index.</p>';
        document.title = "Unknown analysis — ASTRA Discoverability";
        return;
      }
      document.title = displayName(p) + " — ASTRA Discoverability";

      var mine = filesFor(datasets, p.full_name);

      var html =
        '<section class="intro"><h1 class="repo-title">' + escapeHtml(displayName(p)) + "</h1>" +
        '<p class="hash-line"><a class="occ-repo" href="' + escapeHtml(p.html_url) + '" target="_blank" rel="noopener">' + escapeHtml(p.full_name) + " ↗</a>" +
        (p.verified ? '<span class="verified-mark" title="Passes ASTRA validation">✓ verified</span>' : "") +
        '<span class="dataset-count">Updated ' + escapeHtml(timeAgo(p.pushed_at)) + " · " + formatStars(p.stars || 0) + " stars</span>" +
        "</p></section>";

      html += '<div class="detail repo-body">';
      if (p.description) html += '<p class="detail-desc">' + escapeHtml(p.description) + "</p>";

      var findings = (p.findings_list || [])
        .map(function (f) {
          return (
            "<li>" +
            (f.label ? '<span class="finding-label">' + escapeHtml(f.label) + "</span>" : "") +
            (f.claim ? '<span class="finding-claim">' + escapeHtml(f.claim) + "</span>" : "") +
            "</li>"
          );
        })
        .join("");
      if (findings) {
        html += '<div class="detail-section"><span class="detail-label">Findings</span><ul class="findings">' + findings + "</ul></div>";
      }

      var outputs = (p.outputs_list || [])
        .map(function (o) {
          return (
            "<li><span>" + escapeHtml(o.label) + "</span>" +
            (o.type ? '<span class="output-type">' + escapeHtml(o.type) + "</span>" : "") +
            "</li>"
          );
        })
        .join("");
      if (outputs) {
        html += '<div class="detail-section"><span class="detail-label">Outputs</span><ul class="outputs">' + outputs + "</ul></div>";
      }

      var files = mine.files
        .map(function (f) {
          var raw = "https://raw.githubusercontent.com/" + p.full_name + "/" + f.branch + "/" + f.path;
          return (
            "<li>" +
            '<span><a class="file-link" href="dataset.html?h=' + escapeHtml(f.hash) + '">' + escapeHtml(f.name) + "</a>" +
            '<code class="dataset-hash">' + escapeHtml(f.hash.slice(0, 12)) + "</code></span>" +
            '<span class="file-side"><span class="role role-' + escapeHtml(f.role) + '">' + escapeHtml(f.role) + "</span>" +
            '<a class="raw-link" href="' + escapeHtml(raw) + '" target="_blank" rel="noopener">raw ↗</a></span>' +
            "</li>"
          );
        })
        .join("");
      if (files) {
        html += '<div class="detail-section"><span class="detail-label">Data files</span><ul class="outputs datafiles">' + files + "</ul></div>";
      }

      var siblings = projects
        .filter(function (o) {
          if (o.full_name === p.full_name) return false;
          var theirs = filesFor(datasets, o.full_name);
          return Object.keys(mine.hashes).some(function (h) { return theirs.hashes[h]; });
        })
        .map(function (o) {
          return '<a class="link-btn" href="' + escapeHtml(repoUrl(o.full_name)) + '">' + escapeHtml(displayName(o)) + "</a>";
        })
        .join('<span class="sep">·</span>');
      if (siblings) {
        html += '<div class="detail-section"><span class="detail-label">Same data, other analyses</span><div class="siblings">' + siblings + "</div></div>";
      }

      var tags = allTags(p)
        .map(function (t) {
          return '<a class="tag" href="./?q=' + encodeURIComponent(t) + '">' + escapeHtml(t) + "</a>";
        })
        .join("");
      if (tags) {
        html += '<div class="detail-section"><span class="detail-label">Tags</span><div class="tag-list">' + tags + "</div></div>";
      }

      if (p.verified) {
        html +=
          '<div class="detail-section"><span class="detail-label">Verification badge</span>' +
          '<div class="badge-embed"><img src="badges/' + escapeHtml(p.full_name.replace("/", "--")) + '.svg" alt="ASTRA verified">' +
          "<code>" + escapeHtml(badgeMarkdown(p)) + "</code>" +
          '<button class="copy-badge" data-md="' + escapeHtml(badgeMarkdown(p)) + '">copy</button></div></div>';
      } else {
        var reasons = (p.verification_errors || [])
          .slice(0, 4)
          .map(function (e) { return "<li>" + escapeHtml(e) + "</li>"; })
          .join("");
        html +=
          '<div class="detail-section"><span class="detail-label">Verification</span>' +
          '<p class="verify-note">Indexed, but the spec does not pass ASTRA validation:</p>' +
          (reasons ? '<ul class="verify-errors">' + reasons + "</ul>" : "") +
          "</div>";
      }

      html +=
        '<div class="detail-foot">' +
        '<span class="detail-meta">' + escapeHtml(p.full_name) + "</span>" +
        '<a class="repo-link" href="' + escapeHtml(p.html_url) + '" target="_blank" rel="noopener">Open repository ↗</a>' +
        "</div></div>";

      root.innerHTML = html;
    }

    document.addEventListener("click", function (e) {
      var copyBadge = e.target.closest(".copy-badge");
      if (!copyBadge) return;
      navigator.clipboard.writeText(copyBadge.dataset.md).then(function () {
        copyBadge.textContent = "copied";
        setTimeout(function () { copyBadge.textContent = "copy"; }, 1200);
      });
    });

    Promise.all([
      fetch("projects.json", { cache: "no-cache" }).then(function (r) { return r.json(); }),
      fetch("datasets.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).catch(function () { return { datasets: [] }; }),
    ])
      .then(function (results) {
        var data = results[0];
        if (data && data.generated_at && refreshedEl) {
          refreshedEl.textContent = new Date(data.generated_at).toLocaleString(undefined, {
            dateStyle: "medium",
            timeStyle: "short",
          });
        }
        render((data && data.projects) || [], (results[1] && results[1].datasets) || []);
      })
      .catch(function () {
        root.innerHTML = '<p class="empty">Could not load the index.</p>';
      });
  })();
  </script>
</body>
</html>

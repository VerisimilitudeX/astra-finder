name: Build index and deploy to Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install indexer dependencies
        run: pip install requests pyyaml

      - name: Build project index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Keep the committed seed projects.json if the search comes up empty.
        run: python3 scripts/build_index.py --out site/projects.json || echo "index build failed; deploying with committed seed data"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
